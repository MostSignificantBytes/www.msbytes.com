[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "26"

# Fichiers produits par Astro (noms avec empreinte) : cache de longue durée
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# En-têtes de sécurité, toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS : HTTPS imposé pendant deux ans, pour le domaine et tous ses sous-domaines (includeSubDomains).
    # Prérequis : tous les sous-domaines de msbytes.com accessibles en HTTPS.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # Fonctions du navigateur inutiles au site désactivées (caméra, micro, localisation, paiement…)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
