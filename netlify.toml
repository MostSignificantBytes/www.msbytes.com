[build]
  publish = "public"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-sitemap"
  [plugins.inputs]
  # URL de production (sinon le plugin utilise l'URL du site Netlify)
  baseUrl = "https://www.msbytes.com"
  # URL terminées par « / », comme les liens canonical des pages
  trailingSlash = true
  exclude = [
    './public/404.html',
    './public/404/*',
    './public/admin/*',
    './public/offline-plugin-app-shell-fallback/*',
    './public/google*.html',
    './public/_gatsby/**'
  ]
