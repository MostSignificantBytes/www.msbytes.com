[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "26"

# Fichiers produits par Astro (noms avec empreinte) : cache de longue durée
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# En-têtes de sécurité, toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # Fonctions du navigateur inutiles au site désactivées (caméra, micro, localisation, paiement…)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"

# Manifeste de l'application : type MIME attendu par les navigateurs (servi sinon en application/octet-stream)
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
