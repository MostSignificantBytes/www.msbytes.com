- name: blogFR
  label: Blog (français)
  label_singular: Article
  folder: src/content/fr/blog
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{fields.identifier}}'
  filter:
    field: templateKey
    value: blog-post
  summary: "{{title}} ({{date | date('YYYY-MM-DD')}})"
  fields:
  - label: Gabarit
    name: templateKey
    widget: hidden
    default: blog-post
  - label: Langue
    name: language
    widget: hidden
    default: fr
  - label: Chemin
    name: slug
    widget: hidden
  - label: Identifiant (adresse de l'article, identique en français et en anglais)
    name: identifier
    widget: string
    pattern:
    - ^[a-z0-9]+(-[a-z0-9]+)*$
    - Minuscules, chiffres et tirets uniquement (ex. audit-wifi)
    hint: 'Utilisé à la création de l''article : il fixe son adresse (/blog/AAAA-MM-JJ-identifiant/). Saisir le
      même identifiant et la même date pour la version française et la version anglaise.'
  - label: Titre
    name: title
    widget: string
  - label: Date de publication
    name: date
    widget: datetime
    output_utc: true
  - label: Chapeau (affiché sous le titre et lu par les moteurs de recherche)
    name: description
    widget: text
  - label: Mettre en avant
    name: featuredpost
    widget: boolean
    default: false
    required: false
  - label: Vignette
    name: featuredimage
    widget: image
    required: false
  - label: Corps du texte
    name: body
    widget: markdown
  - label: Mots-clés
    name: tags
    widget: list
    required: false
    hint: Réutiliser les mots-clés existants, en minuscules, séparés par des virgules.
