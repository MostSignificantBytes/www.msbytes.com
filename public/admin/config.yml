# Back-office Sveltia CMS (https://www.msbytes.com/admin/).
# Connexion par compte GitHub (fournisseur OAuth de Netlify), circuit de validation :
# chaque modification est un brouillon (branche cms/… et pull request) publié par l'administrateur.
# Fichier généré : voir documentation (corrections C02 à C10). Sur l'adresse de recette, public/admin/init.js
# remplace la branche « master » par « recette ».
backend:
  name: github
  repo: MostSignificantBytes/www.msbytes.com
  branch: master
  base_url: https://api.netlify.com
  commit_messages:
    create: Création {{collection}} « {{slug}} »
    update: Mise à jour {{collection}} « {{slug}} »
    delete: Suppression {{collection}} « {{slug}} »
    uploadMedia: Ajout du média « {{path}} »
    deleteMedia: Suppression du média « {{path}} »
    openAuthoring: '{{message}}'
publish_mode: editorial_workflow
site_url: https://www.msbytes.com
display_url: https://www.msbytes.com
app_title: Back-office MSB
logo:
  src: /img/apple-touch-icon.png
output:
  omit_empty_optional_fields: true
media_folder: src/assets/img
public_folder: /img
