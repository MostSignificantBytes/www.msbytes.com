- name: blog
  label: Blog
  label_singular: Article
  folder: src/content/{{locale}}/blog
  i18n: true
  create: true
  slug: '{{year}}-{{month}}-{{day}}-{{fields.identifier}}'
  filter:
    field: templateKey
    value: blog-post
  summary: '{{title}} ({{date | date(''YYYY-MM-DD'')}})'
  fields:
  - label: Gabarit
    name: templateKey
    widget: hidden
    default: blog-post
    i18n: duplicate
  - label: Langue
    name: language
    widget: hidden
    default: '{{locale}}'
    i18n: true
  - label: Chemin
    name: slug
    widget: hidden
    i18n: true
  - label: Identifiant (adresse de l'article, commun à toutes les langues)
    name: identifier
    widget: string
    pattern:
    - ^[a-z0-9]+(-[a-z0-9]+)*$
    - Minuscules, chiffres et tirets uniquement (ex. audit-wifi)
    hint: Utilisé à la création de l'article, avec la date, pour fixer son adresse (/blog/AAAA-MM-JJ-identifiant/).
    i18n: duplicate
  - label: Titre
    name: title
    widget: string
    i18n: true
  - label: Date de publication
    name: date
    widget: datetime
    output_utc: true
    i18n: duplicate
  - label: Chapeau (affiché sous le titre et lu par les moteurs de recherche)
    name: description
    widget: text
    i18n: true
  - label: Mettre en avant
    name: featuredpost
    widget: boolean
    default: false
    required: false
    i18n: duplicate
  - label: Vignette
    name: featuredimage
    widget: image
    required: false
    i18n: true
  - label: Corps du texte
    name: body
    widget: markdown
    i18n: true
  - label: Mots-clés
    name: tags
    widget: list
    required: false
    hint: Réutiliser les mots-clés existants, en minuscules, séparés par des virgules.
    i18n: true
