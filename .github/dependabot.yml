# Dependabot (format v2).
# Les pull requests de Dependabot visent la branche « recette » (target-branch),
# comme les évolutions : vérifications automatiques, recette, puis recette → master.
# Ce fichier n'est lu par GitHub que sur la branche par défaut (master) : il prend
# effet une fois fusionné dans master.
version: 2
updates:
  # npm : une pull request groupée par mois au plus, vers recette (Astro, intégrations, outils de test).
  # Sveltia CMS est figé (décision de MSB) : ses mises à jour, et celles des trois polices dont il impose
  # les versions (dont Source Sans 3, aussi utilisée par le site), restent des évolutions faites à la main. Limite de GitHub : les pull requests de
  # SÉCURITÉ visent toujours la branche par défaut (master), quel que soit target-branch.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "recette"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "@sveltia/cms"
      - dependency-name: "@fontsource-variable/material-symbols-outlined"
      - dependency-name: "@fontsource-variable/source-sans-3"
      - dependency-name: "@fontsource/noto-mono"
    groups:
      npm:
        patterns: ["*"]
  # Versions des actions utilisées par les vérifications automatiques (.github/workflows) :
  # une pull request groupée par mois au plus, vers recette.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "recette"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
