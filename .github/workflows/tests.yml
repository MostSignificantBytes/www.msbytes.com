# Vérifications automatiques à chaque pull request vers recette ou master, et à chaque mise à jour de recette.
# - « verifs » (bloquant) : construction, contrôle des fichiers produits (scripts/check-dist.mjs),
#   accessibilité, navigation et formulaire de contact (tests/site.spec.mjs).
# - « captures » (informatif, pull requests uniquement) : comparaison visuelle des pages
#   entre la branche cible et la pull request (tests/visual.mjs), résumé dans l'onglet de l'exécution.
# - Vérification mensuelle (le 1er du mois, sur master) : mêmes contrôles, avec une marge de 60 jours
#   pour la date d'expiration de security.txt ; en cas d'échec, « signalement » ouvre (ou complète)
#   une issue « Vérification mensuelle en échec », notifiée par e-mail aux personnes qui suivent le dépôt.
name: Vérifications

on:
  pull_request:
    branches: [recette, master]
  push:
    branches: [recette]
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifs:
    name: Construction, accessibilité et navigation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Contrôle des fichiers produits
        run: node scripts/check-dist.mjs
        env:
          SECURITY_TXT_MARGE: ${{ github.event_name == 'schedule' && '60' || '30' }}
      - run: npx playwright install --with-deps chromium
      - name: Accessibilité, navigation, formulaire
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-tests
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  captures:
    name: Comparaison visuelle (informative)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Construction de la branche cible
        working-directory: base
        run: npm ci && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Captures et comparaison
        run: |
          node tests/visual.mjs base/dist dist rapport-visuel
          cat rapport-visuel/rapport.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-visuel
          path: rapport-visuel/
          retention-days: 14

  signalement:
    name: Signalement de la vérification mensuelle
    needs: verifs
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Ouvrir ou compléter l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITRE="Vérification mensuelle en échec"
          CORPS="La vérification mensuelle de master a échoué le $(date -u +%d/%m/%Y) : $RUN_URL

          Causes probables : date « Expires » de public/.well-known/security.txt à moins de 60 jours (la repousser d'un an, par une branche evol/… et le circuit habituel), ou site qui ne se construit plus.
          Le détail est dans le journal de l'exécution (étape « Contrôle des fichiers produits »)."
          NUM=$(gh issue list --state open --search "\"$TITRE\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$CORPS"
          else
            gh issue create --title "$TITRE" --body "$CORPS"
          fi
